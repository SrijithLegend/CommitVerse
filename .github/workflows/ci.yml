name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *' # nightly: dependency audit (the bake itself runs on the worker's BAKE_CRON)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: '1'
      - name: Secret-in-bundle grep (§11.1)
        run: |
          if grep -rE "SERVICE_ROLE|service_role|sk_live_|sk_test_|TOKEN_ENC_KEY" apps/web/.next/static; then
            echo "::error::Server secret referenced in a client bundle"; exit 1; fi
      - name: Bundle size check (§12)
        run: node scripts/check-bundle-size.mjs
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: ${{ github.event_name != 'schedule' }}

  e2e:
    # Zero-config local mode (embedded Postgres, synthetic universe, dev sign-in, mock payments) + SwiftShader WebGL.
    needs: check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @commitverse/web exec playwright install --with-deps chromium
      - run: pnpm --filter @commitverse/web exec playwright test --project=desktop --project=mobile
        env:
          CI: '1'
          LOCAL_SEED_COUNT: '5000'
      # §13.1 visual regression. Missing baselines are written, not failed: download the artifact and commit
      # apps/web/e2e/visual.spec.ts-snapshots/ to arm the check. Existing baselines are always compared.
      - run: pnpm --filter @commitverse/web exec playwright test --project=visual --update-snapshots=missing
        env:
          CI: '1'
          LOCAL_SEED_COUNT: '5000'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: visual-baselines, path: apps/web/e2e/visual.spec.ts-snapshots, retention-days: 14, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  deploy:
    # main only, after checks + E2E. Each target is skipped until its secrets are configured.
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_SUPABASE: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_FLY: ${{ secrets.FLY_API_TOKEN != '' }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Migrate database (forward-only)
        if: env.HAS_SUPABASE == 'true'
        run: npx --yes supabase@latest db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy web (Vercel)
        if: env.HAS_VERCEL == 'true'
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy worker (Fly)
        if: env.HAS_FLY == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: env.HAS_FLY == 'true'
        run: flyctl deploy --config apps/worker/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy realtime (Cloudflare Durable Objects)
        if: env.HAS_CF == 'true'
        run: pnpm --filter @commitverse/realtime exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke tests
        if: env.HAS_VERCEL == 'true'
        run: |
          set -e
          curl -fsS "$APP_URL/api/v1/universe/current" | grep -q '"version"'
          curl -fsS -o /dev/null "$APP_URL/"
          curl -fsS -o /dev/null "$APP_URL/leaderboards"
          if [ -n "$REALTIME_URL" ]; then curl -fsS "$REALTIME_URL/healthz" | grep -q ok; fi
        env:
          APP_URL: ${{ vars.APP_URL }}
          REALTIME_URL: ${{ vars.REALTIME_HTTP_URL }}

      - name: Sentry release
        if: env.HAS_SENTRY == 'true'
        run: |
          npx --yes @sentry/cli@latest releases new "$GITHUB_SHA"
          npx --yes @sentry/cli@latest releases set-commits "$GITHUB_SHA" --auto
          npx --yes @sentry/cli@latest releases finalize "$GITHUB_SHA"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
