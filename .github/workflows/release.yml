name: Release Beacon
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter commitverse-beacon test
      - run: pnpm --filter commitverse-beacon build
      - run: pnpm --filter commitverse-beacon package
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath packages/vscode-extension/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode-extension/*.vsix
          generate_release_notes: true
